<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payment · Tawasol</title>
<meta name="robots" content="noindex"><meta name="theme-color" content="#f3eddf"><link rel="stylesheet" href="site.css?v=20261107"><link rel="stylesheet" href="hub.css?v=20261107">
<script src="config.js?v=20261107"></script><script src="i18n.js?v=20261107"></script><script src="hub.js?v=20261107"></script>
<style>.pr{max-width:560px;margin:0 auto;text-align:center;padding:40px 20px 60px}.pr .mark{width:88px;height:88px;margin:0 auto 18px;display:block}.pr h1{font-size:26px;margin:0 0 10px}.pr p{font-size:16px;line-height:1.6;color:#4a463f;margin:0 0 14px}.pr .ok{color:#47603a}.pr .wait{color:#6b665c}.pr .btn{margin-top:10px}.pr .acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.pr .acts .btn{margin-top:0}.pr .box{background:#fffdf8;border-radius:14px;padding:16px 18px;margin:16px 0 0;text-align:start;box-shadow:0 1px 2px rgba(43,41,38,.05)}.pr .box h2{font-size:16px;font-weight:700;margin:0 0 4px}.pr .box p{font-size:15px;margin:0 0 10px}.pr .box p:last-child{margin-bottom:0}.pr .box .btn{margin-top:0}.pr .box a{overflow-wrap:anywhere}</style>
</head>
<body data-page="pay">
<header class="nav" id="nav"></header>
<main id="main" class="wrap"><div class="pr"><img class="mark" src="img/mark.png" alt=""><h1 id="t">Checking your payment…</h1><p id="m" class="wait">One moment, please.</p><div id="a"></div></div></main>
<footer id="footer"></footer>
<script>
(function () {
  const C = window.TAWASOL_CONFIG || {}, API = String(C.assistantApi || C.api || '').replace(/\/$/, ''), q = new URLSearchParams(location.search), ref = q.get('ref') || '', tapId = q.get('tap_id') || '';
  let ar = document.documentElement.lang === 'ar';
  const T = () => ar ? { checking: 'نتحقق من دفعك…', wait: 'لحظة من فضلك.', paid: 'موعدك مؤكد', paidm: (s) => (s ? s + '. ' : '') + 'أرسلنا التأكيد واستمارة قصيرة إلى واتسابك.', conf: (s) => (s ? s + '.' : ''), sent: 'أرسلنا التأكيد واستمارة قصيرة إلى واتسابك.', resend: 'إن لم تصلك، اضغط «استلمها على الواتساب».', notsent: 'لاستلام التأكيد على الواتساب، اضغط الزر أدناه ثم أرسل الرسالة الجاهزة.', below: 'الاستمارة القصيرة أدناه.', wabtn: 'استلمها على الواتساب', formh: 'خطوة صغيرة قبل زيارتك', formp: 'يرجى تعبئة هذه الاستمارة القصيرة. نرسل لك موقع العيادة على الواتساب بعد تعبئتها.', formbtn: 'افتح الاستمارة', pending: 'لم يكتمل الدفع بعد', pendm: 'يمكنك إتمام الدفع عبر الرابط نفسه خلال المدة المحددة، وسنؤكد موعدك فور وصوله.', again: 'إتمام الدفع', expired: 'انتهت مدة الدفع', expm: 'حُرِّر الموعد لأن الدفع لم يكتمل خلال ٢٤ ساعة. يسعدنا أن نجد لك وقتاً آخر.', failed: 'لم تنجح عملية الدفع', failm: 'لم يُخصم أي مبلغ. يمكنك المحاولة مرة أخرى عبر الرابط نفسه أو التواصل معنا.', unknown: 'لم نتمكن من التحقق الآن', unkm: 'إن أُخذ المبلغ من حسابك فسيصلك التأكيد على الواتساب خلال دقائق؛ وإن لم يصلك فراسلنا.', back: 'العودة إلى تواصل', chat: 'الحديث مع تواصل' } : { checking: 'Checking your payment…', wait: 'One moment, please.', paid: 'Your appointment is confirmed', paidm: (s) => (s ? s + '. ' : '') + 'We’ve sent the confirmation and a short form to your WhatsApp.', conf: (s) => (s ? s + '.' : ''), sent: 'We’ve sent the confirmation and a short form to your WhatsApp.', resend: 'If they haven’t arrived, tap “Receive it on WhatsApp”.', notsent: 'To receive your confirmation on WhatsApp, tap the button below and send the ready-made message.', below: 'The short form is below.', wabtn: 'Receive it on WhatsApp', formh: 'One small step before your visit', formp: 'Please fill in this short form. We’ll send you the clinic location on WhatsApp once it’s done.', formbtn: 'Open the form', pending: 'Payment not completed yet', pendm: 'You can complete it through the same link within the time allowed; we confirm your appointment as soon as it arrives.', again: 'Complete payment', expired: 'The payment window has closed', expm: 'The time was released because the payment wasn’t completed within 24 hours. We’d be glad to find you another time.', failed: 'The payment didn’t go through', failm: 'Nothing was charged. You can try again through the same link, or message us.', unknown: 'We couldn’t verify it just now', unkm: 'If the amount was taken from your account, the confirmation will reach your WhatsApp within minutes; if not, message us.', back: 'Back to Tawasol', chat: 'Talk to Tawasol' };
  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const show = (title, msg, cls, actions) => { const t = T(); el('t').textContent = title; el('m').textContent = msg; el('m').className = cls || ''; el('a').innerHTML = (actions || []).map((x) => '<a class="btn ' + (x.o ? 'btn-outline' : 'btn-primary') + '" href="' + x.href + '"' + (x.ext ? ' target="_blank" rel="noopener"' : '') + '>' + x.label + '</a>').join(' ') + ' <a class="btn btn-outline" href="clinic.html">' + t.chat + '</a>'; };
  /* Paid — one step at a time: confirmed, then the form. The location follows on WhatsApp once the form is filled. The one-tap WhatsApp button is here because a booking that began on the website has no open WhatsApp session, so the message can only arrive once the client writes first. */
  let rechecks = 0;
  const paid = (r) => { const t = T(); el('t').textContent = t.paid; el('m').className = 'ok';
    el('m').textContent = [t.conf(r.slotLabel || ''), r.delivered ? t.sent + (r.wa ? ' ' + t.resend : '') : r.wa ? t.notsent : t.below].filter(Boolean).join(' ');
    el('a').innerHTML = '<div class="acts">' + (r.wa ? '<a class="btn ' + (r.delivered ? 'btn-outline' : 'btn-primary') + '" href="' + esc(r.wa) + '" target="_blank" rel="noopener">' + t.wabtn + '</a>' : '') + '<a class="btn btn-outline" href="clinic.html">' + t.chat + '</a></div>'
      + (r.form ? '<div class="box"><h2>' + t.formh + '</h2><p>' + t.formp + '</p><p><a class="btn btn-outline" href="' + esc(r.form) + '" target="_blank" rel="noopener">' + t.formbtn + '</a></p></div>' : '');
    if (r.wa && !r.delivered && rechecks < 3) { rechecks++; setTimeout(poll, 8000); } };
  let tries = 0;
  async function poll() { const t = T(); if (!API) return show(t.unknown, t.unkm, 'wait');
    try { const r = await fetch(API + '/api/assistant/pay/status?ref=' + encodeURIComponent(ref) + '&tap_id=' + encodeURIComponent(tapId)).then((x) => x.json()); if (r.lang === 'ar' && !ar) { ar = true; document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
      const t2 = T(); if (r.status === 'paid') return (r.form || r.wa) ? paid(r) : show(t2.paid, t2.paidm(r.slotLabel || ''), 'ok');
      if (r.status === 'expired') return show(t2.expired, t2.expm, 'wait');
      if (['failed', 'declined', 'cancelled', 'abandoned', 'restricted', 'timedout'].includes(String(r.status || r.tap || '').toLowerCase())) return show(t2.failed, t2.failm, 'wait', r.url ? [{ href: r.url, label: t2.again, ext: true }] : []);
      if (r.status === 'pending' && tries >= 4) return show(t2.pending, t2.pendm, 'wait', r.url ? [{ href: r.url, label: t2.again, ext: true }] : []);
      if (r.status === 'unknown' && tries >= 4) return show(t2.unknown, t2.unkm, 'wait');
    } catch (_) { if (tries >= 4) return show(T().unknown, T().unkm, 'wait'); }
    tries++; setTimeout(poll, 2500); }
  el('t').textContent = T().checking; el('m').textContent = T().wait; poll();
})();
</script>
</body>
</html>
